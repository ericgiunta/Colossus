name: CUSTOM_LINTS

on:
  workflow_dispatch:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions: read-all

jobs:
  goodpractice_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          Ncpus: 2
      - name: install libraries
        run: |
          sudo apt-get install libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libfontconfig1-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev libuv1-dev
      - name: move to package and check
        run: |
          ls
          Rscript -e "install.packages(c('devtools', 'remotes', 'goodpractice'))"
          Rscript -e "pak::local_install_deps(dependencies = TRUE)"
          Rscript -e "pak::local_install_dev_deps(dependencies = TRUE)"
          Rscript -e "devtools::install()"
      - name: run tests
        run: |
           Rscript -e "g <- goodpractice::gp(system.file(package = 'Colossus'), checks = goodpractice::all_checks()[c(1:17,19,21:23,25:35,37:326,328:338)])
           print(g)
           if (length(goodpractice::failed_check(g)) == 0){
             stop('Failed checks')
           }
           "
  cpplint_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: |
        pipx run cpplint --filter=-whitespace/line_length,-readability/fn_size,-runtime/references --exclude=src/RcppExports.* --exclude=src/*.*o --exclude=src/Makevars* src/*.* &> cpplint_out.txt
        if grep -q '.cpp' cpplint_out.txt; then
            echo "cpplint error"
            exit 1
        fi
  lintr:
    name: Run lintr scanning
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
